name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # The endpoint tables in docs/API.md must match src/lib/api/routes.ts (the route list the apps build on)
      - run: npm run api:docs:check
      - run: npm test
      # In-memory MongoDB replica set (downloads mongod on first run)
      - run: npm run test:int
      - run: npm run build
